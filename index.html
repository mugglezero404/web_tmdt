<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Shop của tôi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 class="shop-title">Shop Thời Trang ABC</h1>

    <div class="product-list">
      <div class="product">
        <img
          src="https://aothun24h.vn/userfile/products/12301/2024_08_27_11_36_09_38.jpg"
          alt="Áo thun trắng" />
        <h2>Áo thun trắng basic</h2>
        <p>Chất liệu cotton 100%, thoáng mát</p>
        <p>Giá: <span class="price">150.000đ</span></p>
        <button class="btn-cart">Thêm vào giỏ hàng</button>
      </div>

      <div class="product">
        <img
          src="https://cdn.hstatic.net/products/1000402464/fwjn25fh04g___1__273ee08c2aa94c1c8f2a4c3f2ba0207e_master.jpg"
          alt="Quần jean xanh" />
        <h2>Quần jean xanh</h2>
        <p>Form slimfit, co giãn nhẹ</p>
        <p>Giá: <span class="price">350.000đ</span></p>
        <button class="btn-cart">Thêm vào giỏ hàng</button>
      </div>

      <div class="product">
        <img
          src="https://cdn.hstatic.net/products/1000402464/jk26ss10p-ja_jean__1__2a766d876c00481fa234dfcded690885_master.jpg"
          alt="Áo khoác denim" />
        <h2>Áo khoác denim</h2>
        <p>Phong cách unisex, form rộng</p>
        <p>Giá: <span class="price">450.000đ</span></p>
        <button class="btn-cart">Thêm vào giỏ hàng</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
