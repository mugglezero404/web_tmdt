<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Shop của tôi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 class="shop-title">Shop Thời Trang ABC</h1>
    <div style="text-align: right; padding: 10px">
      <span id="user-greeting"></span>
      <button onclick="logout()" class="btn-remove">Đăng xuất</button>
    </div>

    <p class="cart-info">
      🛒 Giỏ hàng: <span id="cart-count">0</span> sản phẩm
    </p>

    <div class="cart-box">
      <h3>Chi tiết giỏ hàng</h3>
      <ul id="cart-items"></ul>
      <p>
        <strong>Tổng tiền: <span id="cart-total">0</span>đ</strong>
      </p>
      <button class="btn-cart" onclick="checkout()">Thanh toán</button>
      <a href="orders.html">Xem đơn hàng của tôi</a>
    </div>

    <!-- Sản phẩm sẽ được JS tự vẽ vào đây -->
    <div class="product-list" id="product-list"></div>

    <script src="common.js"></script>

    <script src="script.js"></script>
  </body>
</html>
